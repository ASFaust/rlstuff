obs_dim: null  # inferred at runtime
n_actions: null

buffer_size: 100000
batch_size: 256
gamma: 0.99
target_entropy: 0.4

lr_value: 0.0001
lr_regret: 0.0001
lr_alpha: 0.0001
optimizer: adam

subtract_min: false 
alpha_init: 0.01
learn_alpha: true
detach_rhs: true #whether to detach the right hand side of the bellman equation when computing the loss

positivity_transform: softplus #transform to ensure regret estimates are positive, can be "softplus", "exp", "relu", "square", or "abs"

use_per: false # whether to use prioritized experience replay
per_clamp: 2.0 # wasserstein transport clamp -> sample up to 10x more from high regret transitions than uniform sampling
